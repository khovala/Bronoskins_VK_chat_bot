version: '3.8'

services:
  # Qdrant — векторная БД для production
  qdrant:
    image: qdrant/qdrant:latest
    container_name: bronoskins_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: 6334

